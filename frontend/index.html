<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Museum (唯博) | 让每一次参展都成为你的故事</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
    .hero-bg { background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://picsum.photos/id/1015/2000/1200') center/cover; }
    
    .museum-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .museum-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    
    .feature-card { transition: all 0.3s; }
    .feature-card:hover { transform: translateY(-4px); }
    
    .tag-selected { background-color: #f59e0b !important; color: white !important; border-color: #f59e0b !important; }

    /* 参观者工作台：与 AI 纪念页统一的系统背景（进入首页后的工作台界面） */
    #visitor-modal.vm-workspace-bg {
      background-image: url('MuseumSource/系统背景.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    .hero-title { text-wrap: balance; }
    html[lang="en"] .hero-title {
      font-size: clamp(1.75rem, 5.5vw + 0.35rem, 3.65rem);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }
    @media (min-width: 640px) {
      html[lang="en"] .hero-title {
        font-size: clamp(2.35rem, 3.5vw + 1.25rem, 4.25rem);
        line-height: 1.1;
      }
    }

    /* 移动端优化 */
    @media (max-width: 640px) {
      .hero-title { font-size: 2.25rem; line-height: 1.1; }
      html[lang="en"] .hero-title { font-size: clamp(1.65rem, 6.2vw + 0.25rem, 2.35rem); line-height: 1.14; }
      .nav-link { font-size: 0.875rem; }
      #visitor-modal .visitor-card-pad { padding: 1.25rem !important; }
      #visitor-modal .visitor-card-pad-lg { padding: 1.25rem !important; }
    }
  </style>
</head>
<body class="bg-white text-zinc-900">

  <!-- 导航栏 - 移动端优化 -->
  <nav class="bg-white/95 backdrop-blur-md border-b border-zinc-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-museum text-3xl text-amber-600"></i>
        <span class="text-2xl font-bold tracking-widest uppercase text-zinc-900">V-Museum 唯博</span>
      </div>
      <div class="flex items-center gap-3 sm:gap-4 flex-wrap justify-end text-sm font-medium">
        <div class="inline-flex rounded-xl border border-zinc-200 overflow-hidden shadow-sm" role="group" aria-label="Language">
          <button type="button" data-lang-btn="zh" onclick="window.VMI18n&&VMI18n.setLocale('zh')" class="px-3 py-2 font-bold transition touch-manipulation" data-i18n="nav.langZh"></button>
          <button type="button" data-lang-btn="en" onclick="window.VMI18n&&VMI18n.setLocale('en')" class="px-3 py-2 font-bold border-l border-zinc-200 transition touch-manipulation" data-i18n="nav.langEn"></button>
        </div>
        <a href="javascript:void(0)" onclick="openVisitorModule()" 
           class="nav-link text-zinc-600 hover:text-amber-600 transition" data-i18n="nav.visitorCenter"></a>
        <div class="w-8 h-8 bg-amber-500 rounded-full flex items-center justify-center text-white font-bold shadow-md text-sm">YC</div>
      </div>
    </div>
  </nav>

  <!-- Hero - 移动端优化 -->
  <header class="hero-bg h-[85vh] sm:h-[80vh] flex items-center text-white">
    <div class="max-w-4xl mx-auto text-center px-5 sm:px-6">
      <h1 class="hero-title text-5xl sm:text-6xl md:text-7xl font-bold leading-tight mb-6 px-2 sm:px-4">
        <span data-i18n="hero.line1"></span><br><span data-i18n="hero.line2"></span>
      </h1>
      <p class="text-lg sm:text-xl text-amber-100 mb-10 px-2" data-i18n="hero.subtitle"></p>
      <button onclick="document.getElementById('roles').scrollIntoView({behavior:'smooth'})" 
              class="bg-amber-500 hover:bg-amber-400 text-white px-10 sm:px-12 py-5 rounded-3xl text-lg font-bold flex items-center gap-3 mx-auto transition-all active:scale-95 shadow-xl">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span data-i18n="hero.cta"></span>
      </button>
      <p class="text-xs text-zinc-300 mt-12 tracking-widest opacity-70" data-i18n="hero.footer"></p>
    </div>
  </header>

  <!-- 参观者主入口（馆方入口见右下角固定按钮） -->
  <section id="roles" class="py-16 sm:py-24 bg-zinc-50 border-y border-zinc-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <h2 class="text-3xl sm:text-4xl font-bold text-center mb-4 text-zinc-900" data-i18n="roles.title"></h2>
      <p class="text-center text-zinc-500 text-sm mb-10 sm:mb-14 max-w-xl mx-auto" data-i18n="roles.hint"></p>
      
      <div class="max-w-2xl mx-auto">
        <button type="button" onclick="openVisitorModule()" 
                class="w-full text-left bg-white hover:bg-zinc-50 rounded-3xl p-8 sm:p-10 transition border-2 border-zinc-200 hover:border-amber-500 group shadow-md hover:shadow-xl">
          <p class="text-amber-600 text-sm font-bold mb-3" data-i18n="roles.cardKicker"></p>
          <h3 class="text-2xl sm:text-3xl font-bold mb-5 group-hover:text-amber-600 transition" data-i18n="roles.cardTitle"></h3>
          <p class="text-zinc-500 leading-relaxed text-[15px]" data-i18n="roles.cardDesc"></p>
        </button>
      </div>
    </div>
  </section>

  <!-- 博物馆方：固定于右下角，醒目但不抢占主视觉 -->
  <button type="button" onclick="openMuseumAdminModule()"
          class="fixed bottom-5 right-4 sm:bottom-8 sm:right-8 z-[60] flex items-center gap-2.5 pl-4 pr-5 py-3.5 rounded-2xl border-2 border-amber-500 bg-white/95 backdrop-blur-sm text-amber-900 font-bold text-sm sm:text-base shadow-lg shadow-amber-900/10 hover:bg-amber-500 hover:text-white hover:border-amber-500 hover:shadow-xl active:scale-[0.98] transition-all group"
          data-i18n-title="fab.museumAdminTitle">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-amber-100 text-amber-700 group-hover:bg-white/20 group-hover:text-white transition-colors">
      <i class="fa-solid fa-building-columns text-lg"></i>
    </span>
    <span class="pr-0.5 leading-snug text-left max-w-[7.5rem] sm:max-w-none" data-i18n="fab.museumAdmin"></span>
  </button>


  
  <div id="visitor-modal" class="hidden fixed inset-0 z-[998] overflow-y-auto vm-workspace-bg">
    <div class="min-h-screen py-6 sm:py-10 pb-24 sm:pb-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6">
        
        <div class="bg-white/95 backdrop-blur-sm rounded-3xl border border-zinc-200 p-6 md:p-8 mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between shadow-xl">
          <div class="flex items-center gap-4 min-w-0">
            <button type="button" id="visitor-back-btn" onclick="performVisitorBack()" class="hidden shrink-0 items-center justify-center gap-2 rounded-full bg-zinc-100 hover:bg-zinc-200 text-zinc-600 sm:text-zinc-700 transition w-10 h-10 sm:w-auto sm:h-auto sm:px-4 sm:py-2.5 sm:rounded-xl sm:font-bold sm:text-sm" data-i18n-title="common.backShortTitle" aria-label="返回上一页">
              <i class="fa-solid fa-arrow-left"></i>
              <span class="hidden sm:inline" data-i18n="common.back"></span>
            </button>
            <div class="min-w-0">
              <p class="text-amber-600 text-sm font-bold" data-i18n="visitor.workbench"></p>
              <h2 id="visitor-title" class="text-xl sm:text-2xl font-bold text-zinc-900 truncate" data-title-key="visitor.titleOverview">趣味功能概览</h2>
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-end gap-2 shrink-0">
            <button type="button" onclick="window.open('ar-demo.html', '_blank')" class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-zinc-200 bg-zinc-50 text-zinc-700 text-sm font-bold hover:border-amber-500 hover:text-amber-700 hover:bg-amber-50 transition" data-i18n-title="visitor.xrBtnTitle">
              <i class="fa-solid fa-qrcode text-amber-600"></i>
              <span data-i18n="visitor.xrBtn"></span>
            </button>
            <button type="button" onclick="closeVisitorModule()" class="px-5 py-2 rounded-xl border border-zinc-200 text-zinc-500 hover:bg-red-50 hover:text-red-600 transition font-medium" data-i18n="visitor.close"></button>
          </div>
        </div>

        <div id="step-0" class="space-y-8 animate-in fade-in duration-500">
          <div class="grid md:grid-cols-3 gap-6">
            <div class="feature-card bg-white/95 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-zinc-200 shadow-sm">
              <div class="text-amber-500 text-4xl mb-4"><i class="fa-solid fa-user-astronaut"></i></div>
              <span class="inline-block mb-3 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold" data-i18n="feature1.badge"></span>
              <h4 class="text-2xl font-bold mb-3 text-zinc-900" data-i18n="feature1.title"></h4>
              <p class="text-lg font-bold text-zinc-800 leading-snug mb-2" data-i18n="feature1.lead"></p>
              <p class="text-zinc-500 mb-8 text-sm leading-relaxed" data-i18n="feature1.desc"></p>
              <button onclick="showFeatureDetail(1)" class="w-full py-4 bg-zinc-50 border border-amber-200 text-amber-700 rounded-2xl font-bold hover:bg-amber-500 hover:text-white transition" data-i18n="feature1.more"></button>
            </div>
            <div class="feature-card bg-white/95 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-zinc-200 shadow-sm">
              <div class="text-amber-500 text-4xl mb-4"><i class="fa-solid fa-clapperboard"></i></div>
              <span class="inline-block mb-3 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold" data-i18n="feature2.badge"></span>
              <h4 class="text-2xl font-bold mb-3 text-zinc-900" data-i18n="feature2.title"></h4>
              <p class="text-lg font-bold text-zinc-800 leading-snug mb-2" data-i18n="feature2.lead"></p>
              <p class="text-zinc-500 mb-8 text-sm leading-relaxed" data-i18n="feature2.desc"></p>
              <button onclick="showFeatureDetail(2)" class="w-full py-4 bg-zinc-50 border border-amber-200 text-amber-700 rounded-2xl font-bold hover:bg-amber-500 hover:text-white transition" data-i18n="feature2.more"></button>
            </div>
            <div class="feature-card bg-white/95 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-zinc-200 shadow-sm">
              <div class="text-amber-500 text-4xl mb-4"><i class="fa-solid fa-route"></i></div>
              <span class="inline-block mb-3 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold" data-i18n="feature3.badge"></span>
              <h4 class="text-2xl font-bold mb-3 text-zinc-900" data-i18n="feature3.title"></h4>
              <p class="text-lg font-bold text-zinc-800 leading-snug mb-2" data-i18n="feature3.lead"></p>
              <p class="text-zinc-500 mb-8 text-sm leading-relaxed" data-i18n="feature3.desc"></p>
              <button onclick="showFeatureDetail(3)" class="w-full py-4 bg-zinc-50 border border-amber-200 text-amber-700 rounded-2xl font-bold hover:bg-amber-500 hover:text-white transition" data-i18n="feature3.more"></button>
            </div>
          </div>
          
          <div class="flex flex-col md:flex-row gap-6 mt-8">
            <button type="button" onclick="startFormalFlow()" class="md:flex-1 py-5 sm:py-6 px-3 bg-amber-500 text-white text-base sm:text-xl font-bold rounded-3xl shadow-xl hover:bg-amber-600 transition-all leading-snug" data-i18n="step0.startJourney"></button>
            <button type="button" id="view-my-plan-btn" onclick="showMyPlans()" class="md:flex-1 py-5 sm:py-6 px-3 bg-white/95 backdrop-blur-sm border-2 border-amber-500 text-amber-600 text-base sm:text-xl font-bold rounded-3xl shadow-lg hover:bg-amber-50 transition-all flex items-center justify-center gap-2 leading-snug">
              <i class="fa-solid fa-map-location-dot shrink-0"></i> <span data-i18n="step0.myPlans"></span>
            </button>
            <button type="button" onclick="window.open('ai-memorial.html', '_blank')" class="group md:flex-1 py-5 sm:py-6 px-3 bg-white/95 backdrop-blur-sm border-2 border-zinc-900 text-zinc-900 text-base sm:text-xl font-bold rounded-3xl shadow-lg hover:bg-zinc-900 hover:text-white transition-all flex items-center justify-center gap-2 leading-snug">
              <i class="fa-solid fa-clapperboard shrink-0 text-amber-500 group-hover:text-white transition-colors"></i> <span data-i18n="step0.aiMemorial"></span>
            </button>
          </div>
        </div>

        <!-- 我的游览计划：左未完成 / 右已完成 -->
        <div id="my-plans-panel" class="hidden animate-in zoom-in duration-300">
          <div class="bg-white rounded-3xl p-6 md:p-8 border border-zinc-200 shadow-2xl max-w-5xl mx-auto">
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-2xl md:text-3xl font-bold text-zinc-900 flex items-center gap-3">
                <i class="fa-solid fa-map-location-dot text-amber-500"></i> <span data-i18n="plans.title"></span>
              </h3>
              <button type="button" onclick="performVisitorBack()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-zinc-200 text-sm font-bold text-zinc-600 hover:border-amber-400 hover:text-amber-800 transition" data-i18n-title="common.backShortTitle">
                <i class="fa-solid fa-arrow-left"></i> <span data-i18n="common.back"></span>
              </button>
            </div>
            <div class="grid md:grid-cols-2 gap-6 min-h-[280px]">
              <div class="flex flex-col rounded-2xl border-2 border-amber-200 bg-amber-50/40 p-4 md:p-5">
                <h4 class="text-amber-800 font-bold text-sm uppercase tracking-wide mb-3 flex items-center gap-2">
                  <span class="text-lg">📍</span> <span data-i18n="plans.incomplete"></span>
                </h4>
                <div id="incomplete-plans-list" class="flex-1 space-y-3 overflow-y-auto max-h-[min(420px,50vh)] pr-1">
                </div>
              </div>
              <div class="flex flex-col rounded-2xl border-2 border-emerald-200 bg-emerald-50/40 p-4 md:p-5">
                <h4 class="text-emerald-800 font-bold text-sm uppercase tracking-wide mb-3 flex items-center gap-2">
                  <span class="text-lg">✅</span> <span data-i18n="plans.completed"></span>
                </h4>
                <div id="completed-plans-list" class="flex-1 space-y-3 overflow-y-auto max-h-[min(420px,50vh)] pr-1">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 未完成计划详情（与「刚生成计划」共用同一版面） -->
        <div id="uncompleted-plan-detail" class="hidden animate-in zoom-in duration-300">
          <div class="bg-white rounded-3xl visitor-card-pad-lg p-6 sm:p-8 md:p-10 border border-zinc-200 shadow-2xl max-w-2xl mx-auto">
            <div class="mb-6">
              <button type="button" onclick="performPlanDetailBack()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-zinc-200 bg-zinc-50 text-sm font-bold text-zinc-700 hover:border-amber-400 hover:text-amber-800 transition">
                <i class="fa-solid fa-arrow-left"></i> <span data-i18n="common.back"></span>
              </button>
            </div>
            <h3 id="uncompleted-detail-title" class="text-2xl sm:text-3xl font-bold mb-6 text-zinc-900 flex flex-wrap items-center gap-3">
              <i class="fa-solid fa-clipboard-list text-amber-500"></i> <span data-i18n="planDetail.title"></span>
            </h3>
            <div class="space-y-5 sm:space-y-6">
              <div class="flex items-start gap-3 sm:gap-4 p-4 sm:p-5 bg-zinc-50 rounded-2xl border border-zinc-100">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 shrink-0 text-lg sm:text-xl"><i class="fa-solid fa-museum"></i></div>
                <div class="min-w-0">
                  <p class="text-xs text-zinc-400 font-bold uppercase" data-i18n="planDetail.labelMuseum"></p>
                  <p id="display-museum-uncompleted" class="text-lg sm:text-xl font-bold text-zinc-900 break-words"></p>
                </div>
              </div>
              <div class="flex items-center gap-4 p-4 sm:p-5 bg-zinc-50 rounded-2xl border border-zinc-100">
                <div class="relative shrink-0">
                  <img id="plan-detail-avatar-img" alt="" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover border-2 border-white shadow-md ring-2 ring-amber-100/80 hidden" width="80" height="80" decoding="async">
                  <div id="plan-detail-avatar-fallback" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 text-xl sm:text-2xl border-2 border-white shadow-md ring-2 ring-amber-100/80" aria-hidden="true">
                    <i class="fa-solid fa-user-astronaut"></i>
                  </div>
                </div>
                <div class="min-w-0 flex-1">
                  <p class="text-xs text-zinc-400 font-bold uppercase" data-i18n="planDetail.labelAvatar"></p>
                  <p id="display-avatar-uncompleted" class="text-lg sm:text-xl font-bold text-zinc-900 break-words"></p>
                </div>
              </div>
              <div class="flex items-start gap-3 sm:gap-4 p-4 sm:p-5 bg-zinc-50 rounded-2xl border border-zinc-100">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 shrink-0"><i class="fa-solid fa-microphone-lines"></i></div>
                <div class="min-w-0">
                  <p class="text-xs text-zinc-400 font-bold uppercase" data-i18n="planDetail.labelVoice"></p>
                  <p id="display-voice-uncompleted" class="text-base sm:text-lg font-bold text-zinc-900 break-words"></p>
                </div>
              </div>
              <div class="flex items-start gap-3 sm:gap-4 p-4 sm:p-5 bg-amber-50 rounded-2xl border border-amber-100">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-amber-500 rounded-full flex items-center justify-center text-white shrink-0"><i class="fa-solid fa-route"></i></div>
                <div class="min-w-0">
                  <p class="text-xs text-amber-600 font-bold uppercase" data-i18n="planDetail.labelRoute"></p>
                  <p id="display-plan-uncompleted" class="text-base sm:text-lg font-bold text-zinc-900 leading-relaxed break-words"></p>
                </div>
              </div>
              <!-- 游览路线图（三处详情共用同一路径，可自行替换图片文件） -->
              <div class="rounded-2xl overflow-hidden border-2 border-amber-100 bg-gradient-to-br from-amber-50 to-zinc-100">
                <p class="text-xs font-bold text-amber-800/90 px-3 py-2 bg-amber-100/80 border-b border-amber-100 flex items-center gap-2">
                  <i class="fa-solid fa-map-location-dot"></i> <span data-i18n="planDetail.mapCaption"></span>
                </p>
                <div class="relative aspect-[16/10] max-h-64 sm:max-h-80 bg-zinc-200/50">
                  <img src="MuseumSource/tour-route-map.png" alt="" class="visitor-route-map-img absolute inset-0 w-full h-full object-cover object-center">
                  <div class="visitor-route-map-fallback absolute inset-0 flex flex-col items-center justify-center text-zinc-500 text-xs sm:text-sm px-4 text-center p-4 hidden">
                    <i class="fa-solid fa-image text-3xl text-amber-400 mb-2 opacity-80"></i>
                    <span data-i18n-html="planDetail.mapFallbackHtml"></span>
                  </div>
                </div>
              </div>
              <div id="plan-detail-postgen-next-wrap" class="hidden">
                <button type="button" onclick="goToPlanSuccessScreen()" class="w-full py-4 bg-zinc-900 text-white text-lg font-bold rounded-2xl hover:bg-black transition shadow-lg flex items-center justify-center gap-2">
                  <span data-i18n="planDetail.nextMore"></span> <i class="fa-solid fa-arrow-right"></i>
                </button>
              </div>
              <div id="plan-detail-actions-row" class="pt-2 flex flex-col sm:flex-row gap-3 sm:gap-4">
                <button type="button" onclick="markViewingPlanCompleted()" class="flex-1 py-4 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition shadow-lg flex items-center justify-center gap-2">
                  <i class="fa-solid fa-circle-check"></i> <span data-i18n="planDetail.markDone"></span>
                </button>
                <button type="button" onclick="window.open('ar-demo.html', '_blank')" class="flex-1 py-4 bg-amber-500 text-white font-bold rounded-xl hover:bg-amber-600 transition shadow-lg" data-i18n="planDetail.tour"></button>
              </div>
              <div id="plan-detail-delete-wrap" class="pt-2">
                <button type="button" onclick="deleteViewingIncompletePlan()" class="w-full py-3 border-2 border-red-200 text-red-600 font-bold rounded-xl hover:bg-red-50 transition flex items-center justify-center gap-2">
                  <i class="fa-solid fa-trash-can"></i> <span data-i18n="planDetail.deletePlan"></span>
                </button>
              </div>
              <div class="pt-2">
                <button type="button" id="plan-detail-bottom-btn" onclick="performPlanDetailBack()" class="w-full py-3 bg-zinc-100 text-zinc-700 font-bold rounded-xl hover:bg-zinc-200 transition" data-i18n="planDetail.backPlans"></button>
              </div>
            </div>
          </div>
        </div>

        <!-- 已完成参观记录面板 -->
        <div id="completed-plans-panel" class="hidden animate-in zoom-in duration-300">
          <div class="bg-white rounded-3xl visitor-card-pad-lg p-6 sm:p-8 md:p-10 border border-zinc-200 shadow-2xl max-w-3xl mx-auto">
            <button type="button" onclick="performVisitorBack()" class="mb-6 inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-zinc-200 bg-zinc-50 text-sm font-bold text-zinc-700 hover:border-amber-400 hover:text-amber-800 transition">
              <i class="fa-solid fa-arrow-left"></i> <span data-i18n="common.back"></span>

             <button onclick="alert(VMI18n.t('alert.adminSubmit'))" class="w-full py-4 bg-zinc-900 text-white font-bold rounded-xl hover:bg-black transition" data-i18n="admin.certSubmit"></button>
           </div>
        </div>
        
        <div id="museum-admin-exhibit-panel" class="hidden bg-white border border-zinc-200 p-10 rounded-3xl shadow-xl">
           <h3 class="text-2xl font-bold mb-8 text-amber-600" data-i18n="admin.exTitle"></h3>
           <div class="grid md:grid-cols-2 gap-10">
              <div class="space-y-6 bg-zinc-50 p-8 rounded-2xl border border-zinc-100">
                <h4 class="font-bold border-b border-zinc-200 pb-2 mb-4" data-i18n="admin.exUp"></h4>
                <input type="text" data-i18n-placeholder="admin.exNamePh" placeholder="文物名称" class="w-full bg-white p-3 rounded-xl border border-zinc-200">
                <button onclick="alert(VMI18n.t('alert.adminAsset'))" class="w-full bg-white border border-amber-500 text-amber-600 py-2 rounded-lg font-bold" data-i18n="admin.exPick"></button>

              <div class="space-y-6 bg-zinc-50 p-8 rounded-2xl border border-zinc-100">
                <h4 class="font-bold border-b border-zinc-200 pb-2 mb-4" data-i18n="admin.exTask"></h4>
                <textarea rows="3" data-i18n-placeholder="admin.exTaskPh" placeholder="描述任务内容..." class="w-full bg-white p-3 rounded-xl border border-zinc-200"></textarea>
                <button onclick="alert(VMI18n.t('alert.adminTask'))" class="w-full bg-amber-500 text-white py-2 rounded-lg font-bold" data-i18n="admin.exPub"></button>
              </div>
           </div>

        <div id="museum-admin-avatar-panel" class="hidden bg-white border border-zinc-200 p-10 rounded-3xl shadow-xl">
           <h3 class="text-2xl font-bold mb-8" data-i18n="admin.avTitle"></h3>
           <div class="max-w-2xl space-y-6">
             <input type="text" data-i18n-placeholder="admin.avPh" placeholder="形象代号" class="w-full bg-zinc-50 p-4 rounded-xl border border-zinc-200">
             <button onclick="alert(VMI18n.t('alert.adminAvatar'))" class="w-full py-4 bg-zinc-900 text-white font-bold rounded-xl" data-i18n="admin.avSave"></button>
           </div>

  <div id="museum-modal" class="hidden fixed inset-0 bg-zinc-900/60 backdrop-blur-sm flex items-center justify-center z-[999]">
    <div class="bg-white rounded-3xl max-w-2xl w-full mx-4 overflow-hidden border border-zinc-200 shadow-2xl scale-in-center text-zinc-900">
      <div id="modal-content"></div>
      <div class="p-4 sm:p-8 border-t border-zinc-100 flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4 bg-zinc-50">
        <button type="button" onclick="hideModal()" class="w-full sm:w-auto px-8 py-3 text-zinc-600 hover:text-zinc-900 transition font-bold border border-zinc-200 rounded-xl hover:bg-white" data-i18n="modal.back"></button>
        <button type="button" onclick="selectMuseum()" class="w-full sm:w-auto bg-amber-500 text-white px-10 py-3 rounded-2xl font-bold hover:bg-amber-600 transition shadow-lg text-center" data-i18n="modal.confirm"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script>
    const museums = [
      { id: 1, name: "苏州博物馆", desc: "吴地文化精华，贝聿铭设计代表作", img: "MuseumSource/苏州博物馆.png", location: "苏州平江路", highlights: "吴门画派、古玉、明清家具", tasks: [{ item: "秘色瓷莲花碗", intro: "寻找五代时期的瓷中极品，观察其如雨后晴天的色彩。", reward: "线上纪念勋章 + 纸质明信片" }, { item: "紫藤园合影", intro: "在贝聿铭亲手选植的紫藤下与虚拟形象合影。", reward: "文创店咖啡 8 折券" }] },
      { id: 2, name: "苏州丝绸博物馆", desc: "千年丝绸之路活化石", img: "MuseumSource/苏州丝绸博物馆.png", location: "苏州南门", highlights: "宋锦、缂丝、刺绣", tasks: [{ item: "缂丝织机", intro: "通过 AR 观察“通经断纬”的织造过程并完成互动问答。", reward: "数字缂丝样本藏品" }, { item: "龙袍展区", intro: "扫描龙袍图案，识别出三处不同的云纹装饰。", reward: "精美桑蚕丝小方巾抽奖券" }] },
      { id: 3, name: "苏州吴文化博物馆", desc: "时光里的文化摆渡", img: "MuseumSource/苏州吴文化博物馆.png", location: "苏州市吴中区", highlights: "吴文化历史 + 传统工艺", tasks: [{ item: "双塔模型", intro: "利用 AR 还原罗汉院双塔的建造过程。", reward: "虚拟建筑成就徽章" }, { item: "吴王余眜剑", intro: "近距离观察青铜剑铭文并完成拼图游戏。", reward: "吴文化文具套装优惠" }] }
    ];

    const avatars = [
      { id:1, name:"伍子胥", type:"历史人物", img:"AvatarSource/伍子胥.png" },
      { id:2, name:"评弹小姐姐", type:"吉祥物", img:"AvatarSource/苏州评弹.png" },
      { id:3, name:"张继", type:"历史人物", img:"AvatarSource/张继.png" },
      { id:4, name:"奶龙", type:"IP联动", img:"AvatarSource/奶龙.png" },
      { id:5, name:"哪吒", type:"动漫IP", img:"AvatarSource/哪吒.png" },
      { id:6, name:"贝聿铭", type:"建筑大师", img:"AvatarSource/贝聿铭.png" }
    ];

    // 全局存储变量
    let selectedMuseum = null;
    let selectedAvatar = null;
    let selectedKeywords = [];
    const STORAGE_KEY = 'vMuseumVisitPlans';
    let visitPlans = [];
    let viewingPlanId = null;
    let viewingCompletedPlanId = null;
    let planDetailReturnMode = null;
    let museumAdminActivePanel = null;

    function setVisitorTitle(key) {
      const el = document.getElementById('visitor-title');
      if (!el || !window.VMI18n) return;
      el.dataset.titleKey = key;
      el.textContent = VMI18n.t(key);
    }

    window.vmRefreshPlanKeywords = function () {
      if (!window.VMI18n) return;
      document.querySelectorAll('#plan-keywords button[data-kw]').forEach(function (b) {
        const k = b.getAttribute('data-kw');
        if (k) b.textContent = VMI18n.t('kw.' + k);
      });
    };

    window.vmAfterLocaleChange = function () {
      if (!window.VMI18n) return;
      const vt = document.getElementById('visitor-title');
      if (vt && vt.dataset.titleKey) vt.textContent = VMI18n.t(vt.dataset.titleKey);
      if (typeof visitorSubpanelVisible === 'function' && visitorSubpanelVisible('uncompleted-plan-detail')) updatePlanDetailChrome();
      if (typeof visitorSubpanelVisible === 'function' && visitorSubpanelVisible('my-plans-panel') && typeof renderMyPlansLists === 'function') renderMyPlansLists();
      const adminModal = document.getElementById('museum-admin-modal');
      const adminTitle = document.getElementById('admin-title');
      if (adminModal && !adminModal.classList.contains('hidden') && adminTitle) {
        if (museumAdminActivePanel === 'certification') adminTitle.textContent = VMI18n.t('admin.sub.cert');
        else if (museumAdminActivePanel === 'exhibit') adminTitle.textContent = VMI18n.t('admin.sub.exhibit');
        else if (museumAdminActivePanel === 'avatar') adminTitle.textContent = VMI18n.t('admin.sub.avatar');
        else adminTitle.textContent = VMI18n.t('admin.hubTitle');
      }
      const mm = document.getElementById('museum-modal');
      if (selectedMuseum && mm && !mm.classList.contains('hidden')) showMuseumDetail(selectedMuseum.id);
    };

    const VISITOR_FLOW_PANEL_IDS = ['step-0', 'step-1', 'step-2', 'step-2-5', 'step-3', 'formal-flow', 'feature-1-detail', 'feature-2-detail', 'feature-3-detail', 'my-plans-panel', 'uncompleted-plan-detail', 'completed-plans-panel'];

    function hideAllVisitorFlowPanels() {
      VISITOR_FLOW_PANEL_IDS.forEach(pid => document.getElementById(pid)?.classList.add('hidden'));
    }

    function visitorSubpanelVisible(id) {
      const el = document.getElementById(id);
      return el && !el.classList.contains('hidden');
    }

    function initRouteMapImages() {
      document.querySelectorAll('.visitor-route-map-img').forEach(img => {
        if (img.dataset.routeMapBound) return;
        img.dataset.routeMapBound = '1';
        img.onerror = function () {
          this.classList.add('opacity-0', 'pointer-events-none');
          const box = this.closest('.relative');
          const fb = box && box.querySelector('.visitor-route-map-fallback');
          if (fb) fb.classList.remove('hidden');
        };
        img.onload = function () {
          this.classList.remove('opacity-0', 'pointer-events-none');
          const box = this.closest('.relative');
          const fb = box && box.querySelector('.visitor-route-map-fallback');
          if (fb) fb.classList.add('hidden');
        };
        if (img.complete && img.naturalWidth === 0) img.onerror();
      });
    }

    function setPlanDetailAvatarPhotoByIds(imgId, fallbackId, avatarName) {
      const img = document.getElementById(imgId);
      const fallback = document.getElementById(fallbackId);
      if (!img || !fallback) return;
      img.onload = null;
      img.onerror = null;
      const name = (avatarName || '').trim();
      const a = avatars.find(x => x.name === name);
      if (a && a.img) {
        img.onload = function () {
          img.classList.remove('hidden');
          fallback.classList.add('hidden');
        };
        img.onerror = function () {
          img.classList.add('hidden');
          fallback.classList.remove('hidden');
        };
        img.alt = a.name;
        img.src = a.img;
        if (img.complete && img.naturalWidth > 0) {
          img.classList.remove('hidden');
          fallback.classList.add('hidden');
        }
      } else {
        img.classList.add('hidden');
        img.removeAttribute('src');
        img.alt = '';
        fallback.classList.remove('hidden');
      }
    }

    function fillPlanDetailFromObject(p) {
      document.getElementById('display-museum-uncompleted').textContent = p.museum || '—';
      document.getElementById('display-avatar-uncompleted').textContent = p.avatar || '—';
      document.getElementById('display-voice-uncompleted').textContent = p.voice || '—';
      document.getElementById('display-plan-uncompleted').textContent = p.plan || '—';
      setPlanDetailAvatarPhotoByIds('plan-detail-avatar-img', 'plan-detail-avatar-fallback', p.avatar);
    }

    function updatePlanDetailChrome() {
      const title = document.getElementById('uncompleted-detail-title');
      const bottom = document.getElementById('plan-detail-bottom-btn');
      const postWrap = document.getElementById('plan-detail-postgen-next-wrap');
      const act = document.getElementById('plan-detail-actions-row');
      const delWrap = document.getElementById('plan-detail-delete-wrap');
      const T = (k) => (window.VMI18n ? VMI18n.t(k) : k);
      if (planDetailReturnMode === 'postGenerate') {
        title.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i> ' + T('planDetail.titleGenerated');
        bottom.textContent = T('planDetail.backContinue');
        postWrap.classList.remove('hidden');
        act.classList.add('hidden');
        delWrap.classList.add('hidden');
      } else {
        title.innerHTML = '<i class="fa-solid fa-clipboard-list text-amber-500"></i> ' + T('planDetail.title');
        bottom.textContent = T('planDetail.backPlans');
        postWrap.classList.add('hidden');
        act.classList.remove('hidden');
        delWrap.classList.remove('hidden');
      }
    }

    function performPlanDetailBack() {
      if (planDetailReturnMode === 'postGenerate') {
        document.getElementById('uncompleted-plan-detail').classList.add('hidden');
        planDetailReturnMode = null;
        viewingPlanId = null;
        showStep(2.5);
        return;
      }
      backToMyPlans();
    }

    function performVisitorBack() {
      if (visitorSubpanelVisible('uncompleted-plan-detail')) {
        performPlanDetailBack();
        return;
      }
      if (visitorSubpanelVisible('completed-plans-panel')) {
        backToMyPlans();
        return;
      }
      if (visitorSubpanelVisible('my-plans-panel')) {
        showStep(0);
        return;
      }
      for (let i = 1; i <= 3; i++) {
        if (visitorSubpanelVisible('feature-' + i + '-detail')) {
          showStep(0);
          return;
        }
      }
      if (visitorSubpanelVisible('step-3')) {
        showStep(0);
        return;
      }
      if (visitorSubpanelVisible('step-2-5')) {
        showStep(2);
        return;
      }
      if (visitorSubpanelVisible('step-2')) {
        showStep(1);
        return;
      }
      if (visitorSubpanelVisible('step-1')) {
        showStep(0);
        return;
      }
      showStep(0);
    }

    function showPlanDetailAfterGenerate(planId) {
      hideAllVisitorFlowPanels();
      loadPlansFromStorage();
      const p = visitPlans.find(x => x.id === planId);
      if (!p) {
        showStep(0);
        return;
      }
      planDetailReturnMode = 'postGenerate';
      viewingPlanId = planId;
      viewingCompletedPlanId = null;
      fillPlanDetailFromObject(p);
      updatePlanDetailChrome();
      document.getElementById('uncompleted-plan-detail').classList.remove('hidden');
      const backBtn = document.getElementById('visitor-back-btn');
      backBtn.classList.remove('hidden');
      backBtn.classList.add('flex');
      setVisitorTitle('visitor.titlePostGenerate');
      initRouteMapImages();
    }

    function goToPlanSuccessScreen() {
      document.getElementById('uncompleted-plan-detail').classList.add('hidden');
      planDetailReturnMode = null;
      viewingPlanId = null;
      showStep(3);
    }

    function resetFormalFlowSession() {
      selectedMuseum = null;
      selectedAvatar = null;
      selectedKeywords = [];
      const vs = document.getElementById('voice-select');
      if (vs) vs.selectedIndex = 0;
      const ta = document.getElementById('custom-plan-input');
      if (ta) ta.value = '';
      document.querySelectorAll('#plan-keywords button').forEach(b => b.classList.remove('tag-selected'));
    }

    function loadPlansFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        visitPlans = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(visitPlans)) visitPlans = [];
      } catch (e) {
        visitPlans = [];
      }
    }

    function savePlansToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(visitPlans));
      } catch (e) { /* 存储已满等 */ }
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatPlanDate(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        const loc = (window.VMI18n && VMI18n.getLocale() === 'en') ? 'en-US' : 'zh-CN';
        return d.toLocaleString(loc, { dateStyle: 'medium', timeStyle: 'short' });
      } catch (e) {
        return '—';
      }
    }

    function planSnippet(plan) {
      const t = plan.plan || '';
      return t.length > 52 ? t.slice(0, 52) + '…' : t;
    }

    function openVisitorModule() {
      loadPlansFromStorage();
      document.getElementById('visitor-modal').classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
      showStep(0);
    }
    function closeVisitorModule() {
      document.getElementById('visitor-modal').classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }
    function backToVisitorHub() {
      showStep(0);
    }

    function showStep(step) {
      hideAllVisitorFlowPanels();
      
      const backBtn = document.getElementById('visitor-back-btn');

      if (step === 0) {
        document.getElementById('step-0').classList.remove('hidden');
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
        setVisitorTitle('visitor.titleOverview');
        
        refreshPlanEntryButton();
      } else {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
        if (step !== -1) {
          document.getElementById('formal-flow').classList.remove('hidden');
          if(step === 2.5) {
             document.getElementById('step-2-5').classList.remove('hidden');
             setVisitorTitle('visitor.stepCustomPlan');
          } else {
             document.getElementById('step-' + step).classList.remove('hidden');
             if(step === 1) { renderMuseums(); setVisitorTitle('visitor.stepPickMuseum'); }
             if(step === 2) { renderAvatars(); setVisitorTitle('visitor.stepAvatar'); }
             if(step === 3) { setVisitorTitle('visitor.stepSuccess'); }
          }
        }
      }
    }

    function showFeatureDetail(id) {
      showStep(-1);
      document.getElementById('feature-' + id + '-detail').classList.remove('hidden');
      setVisitorTitle('visitor.titleFeatureDetail');
    }

    function refreshPlanEntryButton() {
      loadPlansFromStorage();
    }

    function startFormalFlow() {
      resetFormalFlowSession();
      showStep(1);
    }

    function renderMuseums() {
      document.getElementById('museum-grid').innerHTML = museums.map(m => `
        <div onclick="showMuseumDetail(${m.id})" class="museum-card bg-white rounded-3xl overflow-hidden cursor-pointer border border-zinc-200 shadow-sm transition">
          <img src="${m.img}" class="w-full h-52 object-cover">
          <div class="p-6">
            <h3 class="text-xl font-bold text-zinc-900">${m.name}</h3>
            <p class="text-amber-600 text-xs mt-1 mb-3 font-bold"><i class="fa-solid fa-location-dot"></i> ${m.location}</p>
            <p class="text-zinc-500 text-sm line-clamp-2">${m.desc}</p>
          </div>
        </div>
      `).join('');
    }

    function showMuseumDetail(id) {
      selectedMuseum = museums.find(m => m.id === id);
      const Tk = (k) => (window.VMI18n ? VMI18n.t(k) : k);
      const tasksHtml = selectedMuseum.tasks.map(t => `
        <div class="bg-zinc-50 p-4 rounded-xl border border-zinc-200 mb-3 shadow-sm text-left">
          <h5 class="text-amber-700 font-bold text-sm"><i class="fa-solid fa-camera-retro mr-2"></i>${t.item}</h5>
          <p class="text-zinc-500 text-xs mb-1">${t.intro}</p>
          <div class="text-[10px] text-zinc-600 font-medium italic">${Tk('modal.reward')}${t.reward}</div>
        </div>
      `).join('');

      document.getElementById('modal-content').innerHTML = `
        <img src="${selectedMuseum.img}" class="w-full h-60 object-cover">
        <div class="p-8">
          <h2 class="text-3xl font-bold mb-1 text-zinc-900">${selectedMuseum.name}</h2>
          <p class="text-amber-600 mb-6 text-sm font-bold">${selectedMuseum.location}</p>
          <div class="grid md:grid-cols-2 gap-6">
            <div><h4 class="text-zinc-400 font-bold text-xs uppercase mb-2 border-l-4 border-amber-500 pl-2">${Tk('modal.highlights')}</h4><p class="text-zinc-600 text-sm">${selectedMuseum.highlights}</p></div>
            <div><h4 class="text-zinc-400 font-bold text-xs uppercase mb-2 border-l-4 border-amber-500 pl-2">${Tk('modal.tasks')}</h4>${tasksHtml}</div>
          </div>
        </div>
      `;
      document.getElementById('museum-modal').classList.remove('hidden');
    }

    function hideModal() { document.getElementById('museum-modal').classList.add('hidden'); }
    function selectMuseum() {
      hideModal();
      selectedAvatar = null;
      showStep(2);
    }

    function renderAvatars() {
      document.getElementById('avatar-grid').innerHTML = avatars.map(a => `
        <div onclick="selectAvatar(${a.id})" id="avatar-item-${a.id}" class="group cursor-pointer bg-white rounded-2xl p-4 text-center border border-zinc-200 hover:border-amber-500 transition shadow-sm">
          <img src="${a.img}" class="w-16 h-16 mx-auto rounded-full mb-3 group-hover:scale-110 transition shadow-md">
          <h4 class="text-xs font-bold text-zinc-900">${a.name}</h4>
          <p class="text-[9px] text-zinc-400 mt-1 uppercase font-bold">${a.type}</p>
        </div>
      `).join('');
    }

    function selectAvatar(id) {
      selectedAvatar = avatars.find(a => a.id === id);
      document.querySelectorAll('#avatar-grid > div').forEach(el => el.classList.remove('ring-4', 'ring-amber-500', 'border-transparent'));
      document.getElementById('avatar-item-' + id).classList.add('ring-4', 'ring-amber-500', 'border-transparent');
    }

    function goToPlanStep() {
      if(!selectedAvatar) return alert(VMI18n.t('alert.selectAvatar'));
      showStep(2.5);
    }

    function toggleKeyword(btn) {
      const kw = btn.getAttribute('data-kw');
      if (!kw) return;
      if(selectedKeywords.includes(kw)) {
        selectedKeywords = selectedKeywords.filter(k => k !== kw);
        btn.classList.remove('tag-selected');
      } else {
        selectedKeywords.push(kw);
        btn.classList.add('tag-selected');
      }
    }

    function generateAIPlan() {
      const customInput = document.getElementById('custom-plan-input').value.trim();
      let feedback = "";
      let finalPlanStr = "";
      const T = (k) => VMI18n.t(k);
      const kwLabels = selectedKeywords.map(function (k) { return T('kw.' + k); });
      const kwPart = kwLabels.length > 0 ? (T('plan.kwPrefix') + kwLabels.join(T('plan.kwJoin'))) : '';
      const customPart = customInput ? (T('plan.customPrefix') + customInput) : '';

      if (kwPart && customPart) {
        finalPlanStr = kwPart + '；' + customPart;
        feedback = T('fb.combined1');
      } else if (kwPart) {
        finalPlanStr = kwPart;
        feedback = T('fb.prefixKw') + kwLabels.join(T('fb.midKw')) + T('fb.sufKw');
      } else if (customPart) {
        finalPlanStr = customPart;
        const short = customInput.length > 14 ? customInput.substring(0, 14) + '…' : customInput;
        feedback = T('fb.combined2') + short + T('fb.combined2suf');
      } else {
        finalPlanStr = T('plan.standardRoute');
        feedback = T('fb.standard');
      }

      const voiceLabel = document.getElementById('voice-select').value;
      const newPlan = {
        id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : ('p-' + Date.now()),
        museum: selectedMuseum ? selectedMuseum.name : '苏州博物馆',
        avatar: selectedAvatar ? selectedAvatar.name : '评弹小姐姐',
        voice: voiceLabel,
        plan: finalPlanStr,
        createdAt: new Date().toISOString(),
        completed: false,
        completedAt: null
      };
      visitPlans.unshift(newPlan);
      savePlansToStorage();

      document.getElementById('plan-feedback-msg').innerText = feedback;
      showPlanDetailAfterGenerate(newPlan.id);
    }

    // ========== 我的游览计划（多方案、本地持久化） ==========

    function renderMyPlansLists() {
      loadPlansFromStorage();
      const incomplete = visitPlans.filter(p => !p.completed);
      const completed = visitPlans.filter(p => p.completed);
      const incEl = document.getElementById('incomplete-plans-list');
      const compEl = document.getElementById('completed-plans-list');

      const delTitle = escapeHtml(VMI18n.t('common.delete'));
      if (!incomplete.length) {
        incEl.innerHTML = '<p class="text-zinc-400 text-sm text-center py-10">' + escapeHtml(VMI18n.t('plans.emptyIncomplete')) + '</p>';
      } else {
        incEl.innerHTML = incomplete.map(p => `
          <div class="flex gap-0 rounded-2xl border border-amber-200 bg-white hover:border-amber-500 hover:shadow-md transition overflow-hidden">
            <button type="button" onclick="openIncompletePlanDetail('${p.id}')"
              class="flex-1 min-w-0 text-left p-4">
              <p class="font-bold text-zinc-900">${escapeHtml(p.museum)}</p>
              <p class="text-xs text-zinc-500 line-clamp-2 mt-1">${escapeHtml(planSnippet(p))}</p>
              <p class="text-[10px] text-amber-800/70 mt-2">${escapeHtml(formatPlanDate(p.createdAt))}</p>
            </button>
            <button type="button" onclick="deletePlanFromList('${p.id}')" title="${delTitle}"
              class="shrink-0 w-11 flex items-center justify-center border-l border-amber-100 text-red-500 hover:bg-red-50 transition" aria-label="${delTitle}">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `).join('');
      }

      if (!completed.length) {
        compEl.innerHTML = '<p class="text-zinc-400 text-sm text-center py-10">' + escapeHtml(VMI18n.t('plans.emptyCompleted')) + '</p>';
      } else {
        compEl.innerHTML = completed.map(p => `
          <div class="flex gap-0 rounded-2xl border border-emerald-200 bg-white hover:border-emerald-500 hover:shadow-md transition overflow-hidden">
            <button type="button" onclick="openCompletedPlanDetail('${p.id}')"
              class="flex-1 min-w-0 text-left p-4">
              <p class="font-bold text-zinc-900">${escapeHtml(p.museum)}</p>
              <p class="text-xs text-zinc-500 line-clamp-2 mt-1">${escapeHtml(planSnippet(p))}</p>
              <p class="text-[10px] text-emerald-800/70 mt-2">${escapeHtml(formatPlanDate(p.completedAt || p.createdAt))}</p>
            </button>
            <button type="button" onclick="deletePlanFromList('${p.id}')" title="${delTitle}"
              class="shrink-0 w-11 flex items-center justify-center border-l border-emerald-100 text-red-500 hover:bg-red-50 transition" aria-label="${delTitle}">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `).join('');
      }
    }

    function showMyPlans() {
      showStep(-1);
      setVisitorTitle('visitor.titlePlans');
      document.getElementById('my-plans-panel').classList.remove('hidden');
      renderMyPlansLists();
    }

    function deletePlanById(id) {
      loadPlansFromStorage();
      visitPlans = visitPlans.filter(p => p.id !== id);
      savePlansToStorage();
    }

    function deletePlanFromList(id) {
      if (!confirm(VMI18n.t('confirm.deletePlan'))) return;
      deletePlanById(id);
      if (viewingPlanId === id) viewingPlanId = null;
      if (viewingCompletedPlanId === id) viewingCompletedPlanId = null;
      renderMyPlansLists();
      refreshPlanEntryButton();
    }

    function deleteViewingIncompletePlan() {
      if (!viewingPlanId) return;
      if (!confirm(VMI18n.t('confirm.deletePlan'))) return;
      deletePlanById(viewingPlanId);
      viewingPlanId = null;
      planDetailReturnMode = null;
      document.getElementById('uncompleted-plan-detail').classList.add('hidden');
      document.getElementById('my-plans-panel').classList.remove('hidden');
      setVisitorTitle('visitor.titlePlans');
      renderMyPlansLists();
      refreshPlanEntryButton();
    }

    function deleteViewingCompletedPlan() {
      if (!viewingCompletedPlanId) return;
      if (!confirm(VMI18n.t('confirm.deleteCompleted'))) return;
      deletePlanById(viewingCompletedPlanId);
      viewingCompletedPlanId = null;
      document.getElementById('completed-plans-panel').classList.add('hidden');
      document.getElementById('my-plans-panel').classList.remove('hidden');
      setVisitorTitle('visitor.titlePlans');
      renderMyPlansLists();
      refreshPlanEntryButton();
    }

    function openIncompletePlanDetail(id) {
      loadPlansFromStorage();
      const p = visitPlans.find(x => x.id === id && !x.completed);
      if (!p) return alert(VMI18n.t('alert.planNotFound'));

      planDetailReturnMode = 'myPlans';
      viewingPlanId = id;
      viewingCompletedPlanId = null;
      document.getElementById('my-plans-panel').classList.add('hidden');
      document.getElementById('uncompleted-plan-detail').classList.remove('hidden');
      setVisitorTitle('visitor.titlePlanDetail');

      fillPlanDetailFromObject(p);
      updatePlanDetailChrome();
      initRouteMapImages();
    }

    function openCompletedPlanDetail(id) {
      loadPlansFromStorage();
      const p = visitPlans.find(x => x.id === id && x.completed);
      if (!p) return alert(VMI18n.t('alert.completedNotFound'));

      viewingCompletedPlanId = id;
      viewingPlanId = null;
      document.getElementById('my-plans-panel').classList.add('hidden');
      document.getElementById('completed-plans-panel').classList.remove('hidden');
      setVisitorTitle('visitor.titleCompleted');

      document.getElementById('completed-museum').textContent = p.museum;
      document.getElementById('completed-avatar').textContent = p.avatar || '—';
      document.getElementById('completed-voice').textContent = p.voice || '—';
      setPlanDetailAvatarPhotoByIds('completed-plan-avatar-img', 'completed-plan-avatar-fallback', p.avatar);
      document.getElementById('completed-plan').textContent = p.plan;
      document.getElementById('completed-plan-date').textContent = formatPlanDate(p.completedAt || p.createdAt);
      initRouteMapImages();
    }

    function markViewingPlanCompleted() {
      if (!viewingPlanId) return;
      loadPlansFromStorage();
      const p = visitPlans.find(x => x.id === viewingPlanId);
      if (!p || p.completed) return;

      p.completed = true;
      p.completedAt = new Date().toISOString();
      savePlansToStorage();
      viewingPlanId = null;
      planDetailReturnMode = null;

      document.getElementById('uncompleted-plan-detail').classList.add('hidden');
      document.getElementById('my-plans-panel').classList.remove('hidden');
      setVisitorTitle('visitor.titlePlans');
      renderMyPlansLists();
      refreshPlanEntryButton();
    }

    function backToMyPlans() {
      document.getElementById('uncompleted-plan-detail').classList.add('hidden');
      document.getElementById('completed-plans-panel').classList.add('hidden');
      document.getElementById('my-plans-panel').classList.remove('hidden');
      setVisitorTitle('visitor.titlePlans');
      viewingPlanId = null;
      viewingCompletedPlanId = null;
      planDetailReturnMode = null;
      renderMyPlansLists();
    }

    function openAIMemorialForCompletedTrip() {
      if (!viewingCompletedPlanId) return;
      window.open('ai-memorial.html?trip=' + encodeURIComponent(viewingCompletedPlanId), '_blank');
    }

    function openMuseumAdminModule() {
      document.getElementById('museum-admin-modal').classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
      backToMuseumAdminHub();
    }
    function closeMuseumAdminModule() {
      document.getElementById('museum-admin-modal').classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }
    function openMuseumAdminPanel(type) {
      museumAdminActivePanel = type;
      document.getElementById('museum-admin-hub').classList.add('hidden');
      const ab = document.getElementById('admin-back-btn');
      ab.classList.remove('hidden');
      ab.classList.add('inline-flex');
      document.getElementById('museum-admin-' + type + '-panel').classList.remove('hidden');
      const map = { certification: 'admin.sub.cert', exhibit: 'admin.sub.exhibit', avatar: 'admin.sub.avatar' };
      document.getElementById('admin-title').innerText = VMI18n.t(map[type] || 'admin.hubTitle');
    }
    function backToMuseumAdminHub() {
      museumAdminActivePanel = null;
      const ab = document.getElementById('admin-back-btn');
      ab.classList.add('hidden');
      ab.classList.remove('inline-flex');
      document.getElementById('museum-admin-hub').classList.remove('hidden');
      ['certification', 'exhibit', 'avatar'].forEach(t => document.getElementById('museum-admin-' + t + '-panel').classList.add('hidden'));
      document.getElementById('admin-title').innerText = VMI18n.t('admin.hubTitle');
    }

    window.onload = () => {
      loadPlansFromStorage();
      initRouteMapImages();
      if (typeof window.vmRefreshPlanKeywords === 'function') window.vmRefreshPlanKeywords();
      console.log('✅ V-Museum Visitor Module Loaded with Updated Plan System.');
    };
  </script>
</body>
</html>
